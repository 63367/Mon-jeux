<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devine la Côte d’Ivoire · LA MELO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#1b2430;--muted:#66727f;--line:#ecdcc6;--o:#f77f00;--g:#009e60;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261f;--ink:#f3f1ea;--muted:#a9b6ac;--line:#2f4034;--o:#ff9a2e;--g:#2fd18b;--bad:#ff7a7a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.app{max-width:980px;margin:0 auto;padding:0 18px 40px}
#play,#end{max-width:480px;margin:0 auto}
section[hidden]{display:none}
.stripe{height:8px;margin:0 -18px 22px;background:linear-gradient(90deg,var(--o) 0 33.3%,#fff 33.3% 66.6%,var(--g) 66.6%);border-bottom:1px solid var(--line)}
.lead{text-align:center;color:var(--muted);margin:0 0 22px}
button:focus-visible{outline:3px solid var(--g);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.top button,.sm{font:inherit;font-weight:600;background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:var(--g);transition:width .1s linear}
.bar i.low{background:var(--bad)}
.pic{height:170px;display:grid;place-items:center;font-size:5.5rem;background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.cat{margin:0 0 4px;color:var(--o);font-weight:600;font-size:.95rem}
h2{font-size:1.3rem;margin:0 0 14px;line-height:1.25}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;cursor:pointer}
.opt:not(:disabled):hover{border-color:var(--o)}
.opt.ok{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.opt.off{visibility:hidden}
.fact{min-height:3em;color:var(--muted);margin:6px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 22px;background:var(--o);color:#1b1000;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink);font-weight:600}
.btn.gr{background:var(--g);color:#fff}
.big{font-size:3.4rem;text-align:center;margin:10px 0 0}
.res{text-align:center}
.res .row{justify-content:center;margin-top:14px}
.pts{font-size:2.6rem;font-weight:800;color:var(--o);margin:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.hero{position:relative;overflow:hidden;border-radius:0 0 30px 30px;margin:0 -18px 22px;background:linear-gradient(180deg,#0b1b33 0%,#3a2a66 58%,#f77f00 100%);color:#fff;text-align:center;padding:32px 20px 150px}
.hero::before{content:"";position:absolute;right:22px;top:24px;width:44px;height:44px;border-radius:50%;background:#fff3c4;box-shadow:0 0 40px 12px rgba(255,243,196,.35)}
.sky{position:absolute;left:0;right:0;bottom:0;height:120px}
.sky svg{width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1;max-width:560px;margin:0 auto}
.me{display:block;width:132px;height:132px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:4px solid var(--o);box-shadow:0 0 0 6px rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.4)}
.brand{margin:0 0 14px}
.brand b{display:inline-block;background:var(--o);color:#1b1000;font-size:1.6rem;font-weight:800;letter-spacing:.05em;padding:6px 20px;border-radius:99px}
.brand span{display:block;margin-top:6px;font-size:.95rem;opacity:.9}
h1{font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.04;text-align:center;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
.hero h1{text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero .lead{color:#f4efff;margin:0 auto 16px;max-width:46ch}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.chips span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);padding:5px 12px;border-radius:99px;font-size:.9rem}
.rank{text-align:center;margin:0 0 20px}
.rank b{display:block;font-size:1.2rem}
.rank span{color:var(--muted);font-size:.95rem}
.pg{height:8px;max-width:320px;margin:8px auto 0;border-radius:99px;background:var(--line);overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--g))}
#levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.lv{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;padding:0;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.lv:disabled{cursor:not-allowed}
.lv:disabled .sc{filter:grayscale(.85) brightness(.7)}
.lv:not(:disabled):hover{border-color:var(--o);transform:translateY(-3px)}
.sc{position:relative;display:block;height:132px;overflow:hidden}
.sc svg,.sc .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.num,.stars,.lock{position:absolute;z-index:1;top:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:3px 11px;border-radius:99px;font-size:.85rem}
.num{left:10px}.stars,.lock{right:10px}
.stars{color:#ffd36b;letter-spacing:2px}
.tx{display:block;padding:12px 16px 16px}
.tx b{display:block;font-size:1.15rem}
.tx em{display:block;font-style:normal;color:var(--o);font-size:.88rem;font-weight:600;margin:2px 0 6px}
.tx span{display:block;color:var(--muted);font-size:.93rem}
.foot{text-align:center;color:var(--muted);margin-top:34px}
.foot b{color:var(--o)}
@media (prefers-reduced-motion:reduce){.lv{transition:none}}
</style>
</head>

  var pic=$("pic");
  pic.innerHTML=/^(img\/|https?:|data:)/.test(q.i)?'<img alt="" src="'+q.i+'">':"<span>"+q.i+"</span>";
  $("cat").textContent="Question "+(G.idx+1)+" sur "+L.q.length+" · "+q.c;
  $("qt").textContent=q.q;
  $("opts").innerHTML=G.opts.map(function(t,k){return '<button class="opt" data-k="'+k+'" type="button">'+t+'</button>'}).join("");
  $("fact").textContent="";$("next").hidden=true;
  $("half").hidden=false;$("half").disabled=G.half<1;$("half").textContent="50/50 ("+G.half+")";
  $("score").textContent=G.score+" pt";
  clearInterval(G.timer);tick();
  G.timer=setInterval(tick,100);
}
function tick(){
  var L=LEVELS[G.lv];
  if(G.done)return;
  var bar=$("tb");bar.style.width=Math.max(0,G.remain/L.time*100)+"%";
  bar.className=G.remain<=5?"low":"";
  if(G.remain<=0){answer(-1);return}
  G.remain=Math.round((G.remain-.1)*10)/10;
}
function answer(k){
  if(G.done)return;
  G.done=true;clearInterval(G.timer);
  var L=LEVELS[G.lv],q=L.q[G.idx],ok=k>=0&&G.opts[k]===G.correct;
  document.querySelectorAll(".opt").forEach(function(b,n){
    b.disabled=true;
    if(G.opts[n]===G.correct)b.classList.add("ok");
    else if(n===k)b.classList.add("no");
  });
  if(ok){var p=100+Math.ceil(G.remain*5);G.score+=p;G.right++;$("fact").textContent="Bravo, +"+p+" points. "+q.f}
  else $("fact").textContent=(k<0?"Temps écoulé. ":"Raté. ")+"Bonne réponse : "+G.correct+". "+q.f;
  $("score").textContent=G.score+" pt";
  $("half").hidden=true;
  $("next").hidden=false;$("next").textContent=G.idx+1<L.q.length?"Suivant":"Voir mon résultat";
  $("next").focus();
}
$("opts").addEventListener("click",function(e){var b=e.target.closest(".opt");if(b)answer(+b.dataset.k)});
$("half").addEventListener("click",function(){
  if(G.done||G.half<1)return;G.half--;
  var wrong=[];document.querySelectorAll(".opt").forEach(function(b,n){if(G.opts[n]!==G.correct)wrong.push(b)});
  shuffle(wrong).slice(0,2).forEach(function(b){b.classList.add("off");b.disabled=true});
  $("half").textContent="50/50 ("+G.half+")";$("half").disabled=true;
});
$("next").addEventListener("click",function(){
  if(G.idx+1<LEVELS[G.lv].q.length){G.idx++;ask()}else finish();
});
$("quit").addEventListener("click",function(){clearInterval(G.timer);home()});

function finish(){
  var i=G.lv,n=G.right,T=LEVELS[i].q.length,st=n===T?3:n>=T-1?2:n>=Math.ceil(T*2/3)?1:0;
  if(st>P.stars[i])P.stars[i]=st;
  if(G.score>P.best[i])P.best[i]=G.score;
  save();
  $("stars").textContent=starStr(st);
  $("endmsg").textContent=st===3?"Parfait, tu es un vrai Ivoirien du savoir !":st>=1?"Bien joué, niveau réussi !":"Pas encore, réessaie !";
  $("endpts").textContent=G.score+" points";
  $("endsub").textContent=n+" bonne"+(n>1?"s":"")+" réponse"+(n>1?"s":"")+" sur "+LEVELS[i].q.length+(st===0?". Il en faut "+Math.ceil(LEVELS[i].q.length*2/3)+" pour débloquer la suite.":"")+" Meilleur score : "+P.best[i]+".";
  var more=st>=1&&i<LEVELS.length-1;
  $("nextlv").hidden=!more;
  $("share").href="https://wa.me/?text="+encodeURIComponent("J’ai fait "+G.score+" points au "+LEVELS[i].n+" de « Devine la Côte d’Ivoire » par LA MELO, avec "+n+"/"+LEVELS[i].q.length+" ! Essaie de me battre.");
  show("end");
}
$("again").addEventListener("click",function(){start(G.lv)});
$("nextlv").addEventListener("click",function(){start(G.lv+1)});
$("home2").addEventListener("click",home);
home();
</script>
</body>
</html>
