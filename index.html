<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluie d’iPhone</title>
<style>
:root{--bg:#eef3f9;--ink:#0d1b2a;--muted:#55657a;--wave:#14b8e6;--panel:#0b1a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d16;--ink:#eef4fb;--muted:#9bb0c6;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none}
h1{margin:4px 0 2px;font-size:1.5rem;font-weight:800}
p.sub{margin:0 0 10px;color:var(--muted);font-size:.9rem;text-align:center}
.stage{position:relative;width:min(100%,360px);aspect-ratio:360/560;border-radius:18px;overflow:hidden;border:3px solid var(--wave);background:var(--panel)}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(6,13,22,.82);color:#eef4fb;padding:24px}
.ov[hidden]{display:none}
.ov h2{margin:0;font-size:2rem}
.ov p{margin:0;color:#b8c9dc;max-width:28ch}
.me{width:132px;height:132px;border-radius:50%;object-fit:cover;border:4px solid var(--wave);box-shadow:0 0 0 6px rgba(20,184,230,.25)}
.big{font-size:3rem;font-weight:800;color:var(--wave)}
button{font:inherit;font-weight:700;padding:14px 28px;border-radius:12px;border:0;background:var(--wave);color:#03212c;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>

    <h2>Prêt ?</h2>
    <p>📱 +10 &nbsp; 💎 +50 &nbsp; ❤️ +1 vie<br>💣 te fait perdre une vie<br>Enchaîne les prises pour multiplier tes points.</p>
    <button id="go" type="button">Jouer</button>
  </div>
  <div class="ov" id="over" hidden>
    <h2>Partie terminée</h2>
    <div class="big" id="fs">0</div>
    <p id="best"></p>
    <button id="again" type="button">Rejouer</button>
  </div>
</div>
<script>
(function(){
var W=360,H=560,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
var best=0;try{best=+localStorage.getItem('pluie-best')||0}catch(e){}
var st,running=false,last=0,keys={},target=W/2,stars=[];
for(var i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,v:10+Math.random()*30});
function reset(){st={x:W/2,score:0,lives:3,combo:0,t:0,spawn:0,items:[],fx:[],shake:0};target=W/2}
function mult(){return Math.min(5,1+Math.floor(st.combo/5))}
function spawn(){
  var r=Math.random(),type='phone';
  if(r<.24)type='bomb';else if(r<.30)type='gem';else if(r<.335&&st.lives<5)type='heart';
  var lvl=1+st.t/20;
  st.items.push({type:type,x:30+Math.random()*(W-60),y:-30,v:(130+Math.random()*60)*Math.min(lvl,2.6),rot:Math.random()*6,vr:(Math.random()-.5)*3});
}
function pop(x,y,txt,col){st.fx.push({x:x,y:y,txt:txt,col:col,life:.8})}
function update(dt){
  st.t+=dt;
  var dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a||keys.q?1:0);
  if(dir)target=Math.max(35,Math.min(W-35,target+dir*480*dt));
  st.x+=(target-st.x)*Math.min(1,dt*16);
  st.spawn-=dt;
  if(st.spawn<=0){spawn();st.spawn=Math.max(.32,.85-st.t*.012)}
  for(var i=st.items.length-1;i>=0;i--){
    var it=st.items[i];it.y+=it.v*dt;it.rot+=it.vr*dt;
    if(it.y>H-70&&it.y<H-20&&Math.abs(it.x-st.x)<44){
      st.items.splice(i,1);
      if(it.type==='bomb'){st.lives--;st.combo=0;st.shake=.3;pop(it.x,it.y,'Aïe !','#ff6b6b');if(st.lives<=0){end();return}}
      else if(it.type==='heart'){st.lives++;pop(it.x,it.y,'+1 vie','#ff8aa5')}
      else{var p=(it.type==='gem'?50:10)*mult();st.score+=p;st.combo++;pop(it.x,it.y,'+'+p,it.type==='gem'?'#7ee8ff':'#ffffff')}
    }else if(it.y>H+30){st.items.splice(i,1);if(it.type==='phone')st.combo=0}
  }
  for(var j=st.fx.length-1;j>=0;j--){var f=st.fx[j];f.y-=40*dt;f.life-=dt;if(f.life<=0)st.fx.splice(j,1)}
  if(st.shake>0)st.shake-=dt;
}
var EM={phone:'📱',gem:'💎',bomb:'💣',heart:'❤️'};
function draw(dt){
  ctx.save();ctx.clearRect(0,0,W,H);
  if(st&&st.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1a2b');g.addColorStop(1,'#0d3a52');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.55)';
  stars.forEach(function(s){s.y+=s.v*dt;if(s.y>H)s.y=0;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()});
  if(st){
    ctx.textAlign='center';ctx.textBaseline='middle';
    st.items.forEach(function(it){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.type==='bomb'?0:Math.sin(it.rot)*.4);ctx.font='34px serif';ctx.fillText(EM[it.type],0,0);ctx.restore()});
    ctx.font='54px serif';ctx.fillText('🧺',st.x,H-42);
    ctx.font='bold 18px system-ui,sans-serif';
    st.fx.forEach(function(f){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1});
    ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText(st.score,14,26);
    ctx.font='14px system-ui,sans-serif';ctx.fillStyle='#8fd8f0';ctx.fillText('x'+mult()+(st.combo>1?'  série '+st.combo:''),14,50);
    ctx.textAlign='right';ctx.font='20px serif';ctx.fillText('❤️'.repeat(Math.min(st.lives,6)),W-12,26);
  }
  ctx.restore();
}
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(running)update(dt);
  draw(dt);requestAnimationFrame(loop);
}
function begin(){
  reset();running=true;
  document.getElementById('start').hidden=true;document.getElementById('over').hidden=true;
}
function end(){
  running=false;
  var nb=st.score>best;if(nb){best=st.score;try{localStorage.setItem('pluie-best',best)}catch(e){}}
  document.getElementById('fs').textContent=st.score;
  document.getElementById('best').textContent=nb?'Nouveau record !':'Meilleur score : '+best;
  document.getElementById('over').hidden=false;
}
function move(e){var r=cv.getBoundingClientRect();target=Math.max(35,Math.min(W-35,(e.clientX-r.left)/r.width*W))}
cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.key]=false});
document.getElementById('go').addEventListener('click',begin);
document.getElementById('again').addEventListener('click',begin);
reset();requestAnimationFrame(loop);
})();
</script>
